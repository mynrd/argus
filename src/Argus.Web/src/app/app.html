<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/dashboard">
      <span class="eye" aria-hidden="true"></span>
      <span class="name">Argus</span>
    </a>

    <nav class="tabs">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/explorer" routerLinkActive="active">Explorer</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <div class="agent" [class.offline]="!argus.agentOnline()">
      <span
        class="status-dot"
        [class.streaming]="argus.agentOnline()"
        [class.closed]="!argus.agentOnline()"
      ></span>
      <span class="agent-label">{{ argus.agentOnline() ? 'Agent online' : 'Agent offline' }}</span>
    </div>

    @if (session.required()) {
      <button type="button" class="lock-button ghost" (click)="lock()" title="Lock Argus">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 10V7a6 6 0 0 1 12 0v3" />
          <rect x="4" y="10" width="16" height="11" rx="2" />
        </svg>
        <span class="lock-label">Lock</span>
      </button>
    }
  </header>

  @if (argus.lastError(); as error) {
    <div class="banner bad global-error">{{ error }}</div>
  }

  <main>
    <router-outlet />
  </main>
</div>

@if (session.locked()) {
  <argus-lock />
}
