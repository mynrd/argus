<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Argus</title>
  <base href="/">
  <!-- viewport-fit=cover keeps the stream under the notch on a phone in landscape.
       user-scalable=no because the viewer implements its own pinch zoom on the stream;
       browser page zoom on top of it fights the gesture. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
